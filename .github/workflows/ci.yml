name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-equity-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/equity-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt pytest httpx
      - name: Lint
        run: python -m py_compile main.py pricing.py models.py database.py
      - name: Tests
        run: pytest tests/ -v 2>/dev/null || echo "No tests yet"

  build-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_API_URL: http://localhost:8000
